<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Digit Code that Fills the Input Field</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- 6 Digit Code that Fills the Input Field -->
    <div class="card" id="card">
      <div class="ico" id="ico">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
          <path d="M22 6l-10 7L2 6"></path>
        </svg>
      </div>
      <h1 id="ttl">Verify your email</h1>
      <p class="sub" id="sub">We sent a 6-digit code to <b>kami6535@gmail.com</b></p>
      <div class="otp" id="otp" aria-label="One-time password"></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="rs">Did not get it? <b id="cd">Resend in 0:27</b></div>
      <div class="hint">Demo Code: 184316</div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
